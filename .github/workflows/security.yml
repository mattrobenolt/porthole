name: actions-security
on:
  pull_request:
    paths: [".github/**", "Justfile", "flake.nix"]
  push:
    branches: [main]
    paths: [".github/**", "Justfile", "flake.nix"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor audit
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          min-confidence: medium

  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # cache save/restore
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false # GHA cache only; no FlakeHub account or OIDC
      - name: verify action pinning
        run: nix develop -c pinact run --check --verify --min-age 3
