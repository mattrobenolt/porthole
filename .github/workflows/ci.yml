name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # cache save/restore
      contents: read # checkout
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false # GHA cache only; no FlakeHub account or OIDC
      - name: cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      - name: fmt
        run: nix develop -c cargo fmt --check
      - name: clippy (full build)
        run: nix develop -c cargo clippy
      - name: clippy (remote client build)
        run: nix develop -c cargo clippy --no-default-features
      - name: unit tests
        run: nix develop -c cargo test
      - name: smoke rig (client + daemon + junk flood)
        run: nix develop -c bash scripts/smoke.sh
      - name: smoke rig (tunnel registry + lifecycle)
        run: nix develop -c bash scripts/smoke-tunnel.sh
      - name: smoke rig (real ssh end-to-end)
        run: nix develop -c bash scripts/smoke-e2e.sh
      - name: nix build (both roles)
        run: nix build .#porthole .#porthole-remote
      - name: record output paths
        if: github.event_name == 'push'
        id: outputs
        run: |
          echo "paths=$(nix path-info .#porthole .#porthole-remote | paste -sd ' ')" >> "$GITHUB_OUTPUT"
      - name: push to cachix
        if: github.event_name == 'push'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mattrobenolt
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.outputs.outputs.paths }}

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: write # cache save/restore
      contents: read # checkout
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false # GHA cache only; no FlakeHub account or OIDC
      - name: nix build (both roles, darwin)
        run: nix build .#porthole .#porthole-remote
      - name: record output paths
        if: github.event_name == 'push'
        id: outputs
        run: |
          echo "paths=$(nix path-info .#porthole .#porthole-remote | paste -sd ' ')" >> "$GITHUB_OUTPUT"
      - name: push to cachix
        if: github.event_name == 'push'
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mattrobenolt
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.outputs.outputs.paths }}
